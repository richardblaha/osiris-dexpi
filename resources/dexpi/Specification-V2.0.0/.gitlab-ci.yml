image: python:3.12-slim

stages:
  - run_specificator

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  SPECIFICATOR_VERSION: "1.0.0rc15"

cache:
  key: "pip-${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip

before_script:
  - python -V
  - python -m pip install -U pip
  # Install dexpi.specificator from PyPI or TestPyPI depending on branch
  - python -m pip install -U "dexpi.specificator==${SPECIFICATOR_VERSION}" --index-url $PIP_INDEX_URL --extra-index-url https://pypi.org/simple

# --- run the specificator ---
run_specificator:
  stage: run_specificator
  image: python:3.12-slim
  script:
    # Install pdflatex

    - apt-get update
    - apt-get install -y texlive
    - apt-get install -y texlive-latex-extra
    
    # Install Node.js + npm
    - apt-get update && apt-get install -y nodejs npm && rm -rf /var/lib/apt/lists/*
    - node -v && npm -v

    # Run Python Specificator
    - cd src
    - python run_specificator.py
  cache:
    key: "pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
      - .npm
  rules:
    # Main branch → use PyPI
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        PIP_INDEX_URL: "https://pypi.org/simple"
    # All other branches → use TestPyPI
    - if: '$CI_COMMIT_BRANCH != "main"'
      variables:
        PIP_INDEX_URL: "https://test.pypi.org/simple"
  artifacts:
    when: always
    paths:
      - src/.build/**
