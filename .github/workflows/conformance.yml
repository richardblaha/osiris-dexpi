name: DEXPI conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyDEXPI
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tools/dexpi-conformance/pydexpi/requirements.txt

      - name: Install conformance deps
        working-directory: tools/dexpi-conformance
        run: npm install --no-audit --no-fund

      - name: Run conformance (structural only)
        working-directory: tools/dexpi-conformance
        run: |
          node build.mjs
          node test-output/.bin/cli.mjs corpus
          node test-output/.bin/cli.mjs reference
          node test-output/.bin/cli.mjs ours
          node test-output/.bin/cli.mjs diff
          node test-output/.bin/cli.mjs report

      - name: Check for regressions vs baseline
        working-directory: tools/dexpi-conformance
        run: node test-output/.bin/cli.mjs check-regression

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: tools/dexpi-conformance/test-output/report/
